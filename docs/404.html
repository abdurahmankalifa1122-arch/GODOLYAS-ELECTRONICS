<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GODOLYAS ELECTRONICS | Page Redirect</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var host = window.location.hostname;
        var target = '/';
        if (host.indexOf('github.io') !== -1) {
          var segments = path.split('/').filter(Boolean);
          if (segments.length > 0 && host.split('.')[0] !== segments[0]) {
            target = '/' + segments[0] + '/';
          }
        }
        if (path !== target) {
          window.location.replace(target + window.location.hash);
        }
      })();
    </script>

      .card {

      h1 {

        line-height: 1.6;

      a.btn {
        display: inline-block;
        background: #2563eb;
        color: #ffffff;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .phones {

    </style>
